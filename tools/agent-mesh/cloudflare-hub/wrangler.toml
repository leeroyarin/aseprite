name = "agent-mesh-hub"
account_id = "cd1af27f362859633ffe6bc4c447911c"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[durable_objects]
bindings = [
  { name = "HUB_DO", class_name = "AgentMeshHub" }
]

[durable_objects.code_update_strategy]
mode = "immediate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentMeshHub"]

[vars]
PORTAL_AUTH_PROVIDER = "github"
GITHUB_CLIENT_ID = "Ov23lilesbFo3JQJo1Kf"
GITHUB_OWNER_ID = "298677609"
PORTAL_ORIGIN = "https://agent-mesh-hub.slack-clone-arin.workers.dev"

[[d1_databases]]
binding = "HUB_DB"
database_name = "agent-hub-v2"
database_id = "92a8cd91-1178-4fdd-84c2-6dcab3d2e046"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
